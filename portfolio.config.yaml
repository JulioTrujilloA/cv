# ╔══════════════════════════════════════════════════════════════════════╗
# ║              GitVitae — Portfolio Configuration                      ║
# ║  This is the only file you need to edit.                             ║
# ║  Run  pnpm check-config  to catch mistakes before deploying.         ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  ** FIRST THING TO CHANGE **                                         ║
# ║                                                                      ║
# ║  siteMode: "landing"  → shows the GitVitae intro page (default)      ║
# ║  siteMode: "portfolio" → shows YOUR portfolio                        ║
# ║                                                                      ║
# ║  Change it to "portfolio" once you have filled in your details.      ║
# ╚══════════════════════════════════════════════════════════════════════╝
siteMode: "portfolio"   # ← CHANGE THIS to "portfolio"
siteUrl:  "https://juliotrujilloa.github.io/cv"  # ← Your GitHub Pages URL (used for RSS & canonical links)
showPoweredBy: false  # Set to true to show a small "Made with GitVitae" badge in your footer (helps others discover GitVitae)

# ── Identity ───────────────────────────────────────────── (required) ──
name: "Julio Trujillo Alvarado"              # Your name — shown in the header and used as a fallback in the avatar
# title / tagline: bilingües — ver el bloque "content:" más abajo
email: "t.a.j@outlook.com"
phone: ""                    # Vacío a propósito — este repo es público, no quieres tu número ahí. Optional — e.g. "+1 (555) 000-1234". Shown in contact section and resume.
location: "Zapopan, Jalisco, México"
avatarUrl: ""  # Vacío = se muestran tus iniciales como placeholder. Sube tu foto y pega la URL cuando quieras.
# How to add a profile photo (free, no extra account needed):
#   1. Go to your GitHub repo → click "Add file" → "Upload files"
#   2. Upload your photo (e.g. avatar.jpg) into a folder called "public/"
#   3. After committing, open the file on GitHub and copy the raw URL:
#      https://raw.githubusercontent.com/YOU/your-repo/main/public/avatar.jpg
#   4. Paste that URL here.
# Leave empty to show your initials as a styled placeholder.

# ── Resume download ────────────────────────────────────────────────────
# Optional: link directly to a hosted PDF (Google Drive, Dropbox, etc.)
# If left blank the navbar "Resume" button opens the built-in resume page
# where visitors can use "Save PDF" to print their own copy.
#
# How to get a direct download link:
#   1. Visit /resume in your portfolio, click "Save PDF" -> save the file
#   2. Upload that PDF to Google Drive / Dropbox and copy the direct link
#   3. Paste the link below and update resumeFileName accordingly
#
# resumeUrl: "https://drive.google.com/uc?export=download&id=YOUR_FILE_ID"
# resumeFileName: "Git_Vitae_Resume.pdf"

# ── Status ─────────────────────────────────────────────────────────────
openToWork: true         # Shows "Open to Opportunities" banner when true

# ── Theme ──────────────────────────────────────────────────────────────
defaultTheme: "system"   # Options: light | dark | system
colorPreset: "custom"    # Options: indigo | emerald | rose | amber | ocean | slate | custom
primaryColor: "#212121" # Optional — pick any colour you like and paste its hex code here.
                           # Overrides colorPreset above. To find a hex code:
                           #   → Google "colour picker", pick a colour, copy the 6-digit code (e.g. #e11d48)
                           #   → or grab one from coolors.co / your favourite site's colour

resumeTheme:
  twoColumn: "custom"    # Accent color for the two-column resume layout
  classic: "custom"     # Accent color for the classic resume layout

contactFormEndpoint: ""  # Optional — paste a Formspree URL (https://formspree.io/f/xxxx)
                           # or any POST endpoint that accepts {name, email, message}.
                           # Leave empty to use a pre-filled mailto: link instead.

# ── Section visibility ─────────────────────────────────────────────────
# Set show: false to hide any section from your portfolio
sections:
  - { id: about,          show: true  }
  - { id: stats,          show: false }  # Stats already appear as cards in the About section above — enable this only if you want a dedicated full-width stats section
  - { id: skills,         show: true  }
  - { id: languages,      show: true  }
  - { id: experience,     show: true  }
  - { id: projects,       show: false }  # Sin proyectos personales en el CV todavía — actívalo si agregamos alguno
  - { id: education,      show: true  }
  - { id: certifications, show: true  }
  - { id: publications,   show: false }
  - { id: testimonials,   show: false }  # Sin recomendaciones reales todavía
  - { id: contact,        show: true  }

# ── Social links ───────────────────────────── (leave blank to hide) ───
social:
  github:   "https://github.com/JulioTrujilloA"
  linkedin: "https://linkedin.com/in/juliotrujilloalvarado"
  twitter:  ""
  website:  ""

# ── Content (bilingüe) ────────────────────────────────────────────────
# Todo lo que cambia entre idiomas vive aquí, duplicado en "en" y "es".
# El botón EN/ES del navbar guarda tu elección y recarga la página — por
# defecto entra en inglés. Los labels de navegación/botones de la interfaz
# (About, Skills, Resume, etc.) se quedan siempre en inglés a propósito,
# solo el contenido de tu CV cambia de idioma.
content:
  en:
    title: "Computer Engineer"
    tagline: "IT support, process documentation, and project management with 10+ years of experience."

    about: |
      I like teamwork, being proactive, and analyzing problems under pressure.
      I am persistent, punctual, and personal responsibility is part of my day
      to day. I have worked in the IT sector incorporating positive skills,
      with expectations of growth on a personal and professional level.

    stats:
      - { label: "Years of Experience", value: 10, suffix: "+" }
      - { label: "Companies",           value: 5,  suffix: ""  }
      - { label: "Certifications",      value: 2,  suffix: ""  }
      - { label: "Languages",           value: 2,  suffix: ""  }

    # level options: Native | Fluent | Conversational | Basic — keep these
    # exact English words even here, the site uses them as lookup keys.
    languages:
      - { name: "Spanish", level: "Native"        }
      - { name: "English", level: "Conversational" }

    skills:
      - category: "Backend"
        items: [Java, PHP, Delphi, CodeIgniter]
      - category: "Frontend"
        items: ["HTML & CSS", JavaScript, jQuery]
      - category: "Databases"
        items: [MySQL, "SQL Server"]
      - category: "Help Desk / ITSM"
        items: [Jira, Freshdesk, "Mantis BT", SLAs, ITSM]
      - category: "Management"
        items: ["Project Management", "ITIL (knowledge)", "Budget Management"]

    experience:
      - company: "iCorp®"
        role: "On-Site Support Coordinator"
        period: "May 2022 – February 2026"
        description: |
          Provided on-site support for the IT department of an
          agriculture-oriented company, documenting processes and
          supporting PMO projects.
        highlights:
          - Documented IT procedures and processes
          - Set up reports and dashboards in Jira
          - Training and document management (SharePoint)

      - company: "CONAFOR®"
        role: "Technical Documenter"
        period: "May 2019 – May 2022"
        description: |
          Documented ICT contracting and coordinated Feasibility Studies
          before the specialized government function, in line with
          MAAGTICSI.
        highlights:
          - ICT contracting management (MAAGTICSI)
          - Coordinated Feasibility Studies
          - Drove adoption of unified work repositories

      - company: "Axtel®"
        role: "Systems Analyst"
        period: "September 2018 – March 2019"
        description: |
          Served CONAFOR's internal customer, continuing development of
          the Time Clock System in CodeIgniter and maintaining legacy
          systems.
        highlights:
          - Development in CodeIgniter
          - Code and version control with Git
          - MySQL and SQL Server troubleshooting

      - company: "Netwarmonitor®"
        role: "Consultant"
        period: "January 2017 – June 2018"
        description: |
          Trained and implemented administrative software (point of sale)
          for clients, and coordinated delivery of INADEM government
          benefits.
        highlights:
          - Remote (AnyDesk) and on-site training
          - Help desk with Mantislog and Freshdesk
          - Functional and acceptance testing

      - company: "CONTPAQi®"
        role: "SLA & Software Development"
        period: "December 2015 – October 2016"
        description: |
          Level 3 SLA for the Payroll System, resolving SQL Server and
          Delphi errors, with incident tracking in OTRS.
        highlights:
          - Level 3 SLA support
          - Delphi development and maintenance (Visual Studio + TFS)
          - Functional and acceptance testing

    education:
      - institution: "Tecmillenio, Mexico"
        degree: "MSc in IT Management"
        period: "August 2020 – September 2022"

      - institution: "University of Guadalajara"
        degree: "Bachelor of Science in Computer Engineering"
        period: "August 2010 – December 2014"

    certifications:
      - title: "Oracle Certified Java Programmer 6"
        issuer: "Develop Talent & Technology"
        date: "2015"
        credentialUrl: ""
        badgeUrl: ""
        tags: [Java, Certification]

      - title: "Java Backend Development Training"
        issuer: "Generation México"
        date: "2018"
        credentialUrl: ""
        badgeUrl: ""
        tags: [Java, Backend]

  es:
    title: "Ingeniero en Computación"
    tagline: "Soporte de TI, documentación de procesos y gestión de proyectos con más de 10 años de experiencia."

    about: |
      Me gusta el trabajo en equipo, ser proactivo y el análisis de problemas bajo presión.
      Soy persistente, puntual y la responsabilidad personal forma parte de mi día a día.
      He trabajado en el sector de TI incorporando aptitudes positivas, con expectativas
      de crecimiento a nivel personal y profesional.

    stats:
      - { label: "Años de experiencia", value: 10, suffix: "+" }
      - { label: "Empresas",            value: 5,  suffix: ""  }
      - { label: "Certificaciones",     value: 2,  suffix: ""  }
      - { label: "Idiomas",             value: 2,  suffix: ""  }

    # level: mismas palabras en inglés que arriba — el sitio las usa como
    # llave interna para elegir color/puntos de nivel, no se traducen.
    languages:
      - { name: "Español", level: "Native"        }
