      With 10+ years in IT — coordinating and managing projects across
      private companies and government institutions — I like teamwork,
      being proactive, and analyzing problems under pressure. I am
      persistent, punctual, and personal responsibility is part of my day
      to day. I have worked in the IT sector incorporating positive skills,
      with expectations of growth on a personal and professional level.

