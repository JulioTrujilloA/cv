          PMO projects.
        highlights:
          - Met a yearly KPI of 35–50 service requests resolved (minor changes and small new features)
          - Implemented Hybo, a hybrid workplace management platform, at company headquarters — delivered the project successfully
          - Set up ~15 Jira boards and reports for 4 teams (Security, Infrastructure, Applications, and Data)
          - Onboarded every new hire (10–15 people) and managed 2 SharePoint sites, including the PMO framework documentation
          - Documented ~5 core IT procedures and processes

      - company: "CONAFOR®"
